services:
  - type: web
    name: minimemory-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn minimemory.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minimemory-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
databases:
  - name: minimemory-db
    plan: free
